# Configuration for boat-bt-power and boat-bluetooth-resume.service - see
# docs/05-phase2-boat-computer-layer.md, "Bluetooth: on by default, and still
# on after a wake".
#
# Sourced by /bin/sh, so plain VAR=value assignments only.
#
# NOTE the boot-time default is NOT here: it is [Policy] AutoEnable=true in
# /etc/bluetooth/main.conf, which is what powers the controller up as soon as
# bluetoothd finds it. Set that to false for a board that should stay
# radio-silent until asked.

# 1 = put the pre-suspend Bluetooth state back after every resume. This is
# what keeps a radio that was ON before a `boat-sleep` from coming back OFF,
# and equally what keeps one you deliberately switched off from coming back
# on behind you. Set to 0 to leave the resume entirely to bluetoothd's own
# AutoEnable policy.
BOAT_BT_RESUME_RESTORE=1

# Seconds to wait after a resume for bluetoothd to publish an adapter. The
# on-board RTL8822CE Bluetooth function re-enumerates on the USB bus on the
# way out of SC7, so it is simply not there for the first moments after the
# wake. Costs nothing when the controller is quick - the wait ends as soon as
# the adapter appears, not when the timer does. Raising it much past 60 also
# needs TimeoutStartSec raised in boat-bluetooth-resume.service, or systemd
# kills the restore at its 90s default before the wait is over.
BOAT_BT_RESUME_WAIT=20

# What a restore assumes when there is no recorded state - a resume whose
# "pre" hook never ran, or a save that could not reach bluetoothd. "on"
# matches this image's AutoEnable=true policy: when in doubt, the radio is
# on. Set to "off" if an unknown state should mean silence instead.
BOAT_BT_DEFAULT=on
