# BlueZ daemon configuration for the boat computer.
#
# WHY THIS FILE EXISTS AT ALL
# poky's bluez5 recipe installs profiles/network/network.conf and
# profiles/input/input.conf into /etc/bluetooth, but NOT main.conf: upstream
# leaves conf_DATA empty in Makefile.am and ships src/main.conf as EXTRA_DIST
# only, so `make install` never puts one there and the recipe does not add it.
#
# With no /etc/bluetooth/main.conf, bluetoothd's load_config() frees the
# keyfile and btd_get_main_conf() returns NULL. plugins/policy.c's
# policy_init() then takes its `if (!conf) ... goto done` early-out, which
# leaves the file-scope `static bool auto_enable = false` untouched - so
# policy_adapter_probe() never calls btd_adapter_restore_powered(), and EVERY
# controller bluetoothd probes is left unpowered. That is the whole of the
# "Bluetooth is always off at boot, and off again after every wake from SC7"
# symptom: a packaging gap, not a driver or firmware problem. (Line numbers
# for bluez 5.65, the version this image builds: plugins/policy.c:77, :834,
# :846-861.)
#
# Note the inversion that makes merely SHIPPING this file the fix: with the
# file present but AutoEnable absent, the GKeyFile lookup fails, policy.c
# clears the error and sets auto_enable = true (plugins/policy.c:894-899).
# The explicit setting below only says out loud what that would do anyway.
#
# Everything not set here keeps bluetoothd's compiled-in default. That is
# safe, and deliberately so: every other option is parsed with the same
# "key missing -> keep the value init_defaults() already set" pattern, so a
# minimal file changes nothing but the one policy it names. See upstream's
# fully commented src/main.conf for the full list of what could go here.

[Policy]
# Power up every controller as soon as bluetoothd finds it - at boot, and
# again on every later re-probe, which is what happens when the devkit's
# RTL8822CE Bluetooth function re-enumerates on the USB bus after a resume
# from SC7. This is what makes Bluetooth ON by default on this image.
#
# Set it to false for an installation that should stay radio-silent until
# somebody asks for Bluetooth - and note that boat-bluetooth-resume.service
# would then still put back whatever state was in effect before a sleep,
# which is the behaviour you almost certainly still want.
AutoEnable=true
