# Mount the ESP of THIS drive, by device and GPT entry number. meta-tegra's
# unit mounts /dev/disk/by-partlabel/esp - and a JetPack SD card or a USB
# stick can carry a partition labelled "esp" too, which would put GRUB's boot
# state on someone else's media. Installed by boat-ab-boot (A/B images only).
#
# fsck it first, as an fstab entry would be: the ESP is written on every
# boot (GRUB's attempt counter, the commit), and a FAT left inconsistent by
# a power cut would otherwise be remounted read-only by the kernel on its
# first error - after which no boot could be confirmed. Wants, not
# Requires: if fsck cannot repair it, mounting it anyway still gives the
# commit its best chance; refusing would stop every commit on both slots.
[Unit]
Wants=systemd-fsck@@ESP_UNIT@.service
After=systemd-fsck@@ESP_UNIT@.service

[Mount]
What=@DISK@p@PARTNUM_ESP@
