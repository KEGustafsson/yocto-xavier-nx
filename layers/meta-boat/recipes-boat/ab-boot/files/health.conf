# The A/B health gate's settings - boat-commit, docs/plans/ab-os-updates.md
# 5.4. Read on every boot; Tier 2 (everything here) only decides trial boots.
# A trial that fails any of it is marked bad, the board falls back, and that
# release is not offered to this board again. This file is shell: a line
# that cannot be read makes the gate use its defaults (and say so in
# 'boat-update status').
#
# Units that must be active before a slot on trial is committed. docker is
# added automatically when /data is mounted. These are boat-image's: an
# A/B image without NetworkManager or sshd (core-image-base, say) needs its
# own list here, or every one of its trials fails.
BOAT_HEALTH_UNITS="NetworkManager.service systemd-logind.service dbus.service boat-bootmode-guard.service sshd.socket"

# Units that must be active too, but only when /data is mounted - anything
# that lives on /data, such as boat-compose.service. Listed above instead,
# they would fail every trial on a board whose DATA is broken.
BOAT_HEALTH_DATA_UNITS=""

# Units that must NOT have failed (empty: none checked).
BOAT_HEALTH_FAILED_UNITS=""

# 1 = also run every executable in BOAT_HEALTH_CHECKS_DIR, in name order,
# as root, with no display (DISPLAY is not set). Each must exit 0 within
# BOAT_HEALTH_CHECK_TIMEOUT seconds; its output goes to
# 'journalctl -b -u boat-commit'. They run on trial boots only, and only
# once /data is mounted (the directory is on it). Off by default: a check
# that depends on anything outside the boat would roll back a good update.
BOAT_HEALTH_CHECKS_D=0
BOAT_HEALTH_CHECKS_DIR=/data/boat-update/health.d
BOAT_HEALTH_CHECK_TIMEOUT=60

# How long (seconds) the checks are retried before the trial fails (at most
# 540).
BOAT_HEALTH_DEADLINE=540
