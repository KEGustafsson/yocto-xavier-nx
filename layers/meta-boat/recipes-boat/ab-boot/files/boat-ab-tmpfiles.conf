# A/B layout: the A/B lock (one grubenv writer at a time) and boat-update's
# own lock are root's alone. flock(2) locks a file opened only for reading
# as well, so a lock file any user could open would let that user hold off
# every grubenv write, install and rollback - and fail every trial. Made
# here, before anything takes them; boat-ab's lib.sh keeps its own 0600.
d /run/boat-ab 0755 root root -
f /run/boat-ab/commit.lock 0600 root root -
f /run/boat-update.lock 0600 root root -
