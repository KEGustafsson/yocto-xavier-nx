# A/B layout: sshd.socket is one of the health gate's critical units, so it
# must not be something a network peer can switch off. systemd's default
# trigger limit for an Accept=yes socket (200 connections in 2 s) puts the
# socket into the failed state for the rest of the boot: a connection flood
# from the marina Wi-Fi during a trial would fail the release. Without the
# limit a flood is refused one connection at a time instead - at most
# MaxConnections (64) sshd processes, and a few per source address.
[Socket]
TriggerLimitIntervalSec=0
MaxConnectionsPerSource=8
