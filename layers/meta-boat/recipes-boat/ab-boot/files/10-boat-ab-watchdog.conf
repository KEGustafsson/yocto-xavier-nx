# A/B layout (docs/plans/ab-os-updates.md 5.5, decision D8): systemd is the
# one process that opens /dev/watchdog. A wedged PID 1 then resets the board
# within a minute, and a shutdown that hangs within ten - both ending in the
# reboot the A/B fallback needs. (The watchdog daemon is not installed on
# this layout: two openers of one device cannot both work.)
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=10min
