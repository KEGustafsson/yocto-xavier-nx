# A/B layout: no suspend while an update is on trial and not committed yet,
# or while one is being installed - whoever asks, root's own
# `systemctl suspend` included (logind never holds root back with root's own
# inhibitor locks). The suspend job then fails and the board stays up.
# boat-ab-boot installs this for systemd-suspend, -hibernate, -hybrid-sleep
# and -suspend-then-hibernate.
[Service]
ExecStartPre=/usr/sbin/boat-commit --may-sleep
