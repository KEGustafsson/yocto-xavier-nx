# Keyboard layout for the boat's helm display, replacing the
# "keymap_layout" weston.ini setting earlier versions of this image used.
#
# Xorg reads /etc/X11/xorg.conf.d/*.conf in sorted order, on top of
# /etc/X11/xorg.conf (which meta-tegra's tegra-configs-xorg installs from
# L4T's t194 reference config - that one configures the "nvidia" display
# driver and says nothing about input).
#
# Applies to whichever input driver claims the keyboard (xf86-input-libinput
# or xf86-input-evdev); MatchIsKeyboard matches both.
Section "InputClass"
    Identifier "boat-helm-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "@BOAT_HMI_XKB_LAYOUT@"
EndSection
