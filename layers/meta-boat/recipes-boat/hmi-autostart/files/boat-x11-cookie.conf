# Runtime directory for the X authorization cookie boat-xfce-session exports
# for containerized GUI apps (docs/05-phase2-boat-computer-layer.md,
# "Container GUI apps on the HDMI screen (X11)").
#
# 0711, owned by the HMI session user. The two halves have to agree: the cookie
# file inside is 0644 precisely because container images run their app as
# whatever uid they please - but a process still needs SEARCH permission on the
# directory to open a file by name inside it, and 0700 (what this used to be)
# grants that to uid 2000 alone. Every container running as any other
# non-root uid got EACCES on the cookie and failed with "cannot open display",
# which is the exact outcome the 0644 was added to prevent.
#
# 0711 is traverse-by-name for everyone and list-the-contents for nobody: a
# process that already knows the path "Xauthority" can open it, and nothing
# else can enumerate what is in here. That is the protection that was wanted;
# 0700 was simply too strong to be compatible with its own purpose.
#
# Created by systemd-tmpfiles at early boot rather than by the session, for
# two reasons: an unprivileged session cannot mkdir in /run at all, and the
# directory has to exist before docker.service starts - dockerd creates a
# missing bind-mount source itself, as a root-owned directory, and a container
# that came up first would then be stuck on that empty one forever.
#
# Deliberately NOT under /run/user/<uid>: logind mounts a tmpfs there per
# login session, so a container started before the first login would end up
# pinned to the directory underneath that mount and never see the cookie.
d /run/boat-x11 0711 @BOAT_HMI_USER@ @BOAT_HMI_USER@ -
