# Runtime directory for the X authorization cookie boat-xfce-session exports
# for containerized GUI apps (docs/05-phase2-boat-computer-layer.md,
# "Container GUI apps on the HDMI screen (X11)").
#
# 0700, owned by the HMI session user. This cookie is FULL X-server access -
# input injection, screen capture, window manipulation - so the directory is
# what keeps it away from other local uids, and 0700 is deliberate.
#
# 0711 was tried and reverted: it is traverse-by-name for everyone, and
# "Xauthority" is a predictable name, so any local uid could then read the
# cookie. That is the same blanket local grant `xhost +local:` used to give,
# which this whole mechanism exists to replace - see boat-xfce-session.
#
# WHAT THAT MEANS FOR CONTAINERS, precisely: a container can read the cookie
# if it runs as root (which bypasses the directory permission) or as
# BOAT_HMI_UID, i.e. 2000. That is what the shipped X11 examples do -
# Dockerfile.firefox.example creates `boat` at uid 2000 and runs as it, and
# browser.yml.example says so. A container that must run as some other
# non-root uid needs a narrower arrangement of its own (copy the cookie to a
# path that uid can read, or give the directory a group and add that gid with
# `group_add`) - not a world-searchable directory here.
#
# Created by systemd-tmpfiles at early boot rather than by the session, for
# two reasons: an unprivileged session cannot mkdir in /run at all, and the
# directory has to exist before docker.service starts - dockerd creates a
# missing bind-mount source itself, as a root-owned directory, and a container
# that came up first would then be stuck on that empty one forever.
#
# Deliberately NOT under /run/user/<uid>: logind mounts a tmpfs there per
# login session, so a container started before the first login would end up
# pinned to the directory underneath that mount and never see the cookie.
d /run/boat-x11 0700 @BOAT_HMI_USER@ @BOAT_HMI_USER@ -
