# Drop-in for docker.service, installed by boat-docker-config.
#
# daemon.json puts dockerd's data-root on /data. RequiresMountsFor resolves to
# whichever unit actually provides the closest mount point for that path, so
# this is correct in both states the image can be in:
#
#   /data is a directory on the rootfs  -> pulls in -.mount, always active,
#                                          no effect beyond being harmless
#   /data is its own partition          -> dockerd waits for it
#
# The second case is the one that matters. Without this, dockerd starts first,
# creates /data/docker on the UNDERLYING rootfs directory, and every image,
# container and volume it writes there disappears from view the moment the real
# mount lands on top - with no error anywhere.
[Unit]
RequiresMountsFor=/data
