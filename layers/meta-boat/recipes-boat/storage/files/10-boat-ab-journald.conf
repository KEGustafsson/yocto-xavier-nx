# A/B layout: the persistent journal lives on /data (DATA is shared, so the
# cap is what keeps logs from crowding out Docker).
#
# SystemKeepFree: journald's default keeps 5% of the filesystem (up to
# 4 GiB) free. On a DATA that Docker or a downloaded bundle has filled past
# that, the journal stops growing - it keeps no more than it held at boot -
# so older boots, such as the failed trial 'journalctl -b -1' is meant to
# show after a fallback, are thrown out sooner, and a disk filled closer
# still can push the journal back into RAM. 512 MiB is well below the
# 2 GiB boat-update keeps free (FREE_FLOOR), and the journal itself is
# capped at 256 MiB anyway.
[Journal]
SystemMaxUse=256M
SystemKeepFree=512M
