# Wake-on-LAN, from NetworkManager's side.
#
# NM owns the WoL flags of any interface it manages: it re-applies the
# connection profile's wake-on-lan setting on every activation - a cable
# replug, a profile edit, a resume - so its own default would quietly clear
# what boat-wol.service armed with ethtool at boot. Setting the global
# connection default here makes NM re-arm magic-packet wake itself instead,
# so the two agree rather than fight.
#
# The value is 64, not "magic". NM's *connection defaults* - what this file
# sets - are read for this property with an integer parser
# (nm_config_data_get_connection_default_int64), not with the keyword parser
# nmcli and keyfile profiles use. "magic" therefore fails to parse and NM
# falls back to leaving the flag entirely alone, which is exactly the symptom
# recorded in boat-wol-dispatcher.sh's header: "nmcli reports the active
# profile's wake-on-lan as 'default', and the magic-packet flag is clear both
# at boot and after every resume". 64 is NM_SETTING_WIRED_WAKE_ON_LAN_MAGIC.
#
# The dispatcher script remains the mechanism this image RELIES on - it runs
# after NM's own activation and so cannot lose the race - and this file is the
# belt to its braces. Fixing the value here means the two now actually agree
# rather than one of them being inert.
#
# Managed by the boat-power recipe in meta-boat; the interface list comes
# from BOAT_WOL_INTERFACES at build time.
[connection-boat-wol]
match-device=@BOAT_WOL_MATCH@
ethernet.wake-on-lan=64
