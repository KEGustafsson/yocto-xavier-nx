# Configuration for boat-wol-arm and boat-sleep - see
# docs/05-phase2-boat-computer-layer.md, "Power: Wake-on-LAN and remote SC7".
#
# Sourced by /bin/sh, so plain VAR=value assignments only.

# Interfaces to arm for Wake-on-LAN, space separated. eth0 is the devkit's
# on-board RJ45; add another (a USB GbE adapter, say) if it should also be
# able to wake the box. An interface that doesn't exist, or whose driver
# reports no magic-packet support, is skipped with a message - never fatal.
BOAT_WOL_INTERFACES="eth0"

# 1 = boat-sleep refuses to suspend unless at least one interface is armed
# for magic-packet wake. This is the safety interlock that keeps a remote
# `ssh root@boat boat-sleep` from putting the boat computer to sleep with no
# way of getting it back short of walking to the helm and pressing a button.
# `boat-sleep --force` overrides it for a one-off.
BOAT_SLEEP_REQUIRE_WOL=1

# Seconds to wait before asking logind to suspend. `systemctl suspend`
# returns as soon as logind accepts the request, so an SSH session running
# boat-sleep gets its output and exit status back either way; this delay
# just gives the connection time to close cleanly before the link drops.
BOAT_SLEEP_DELAY=3

# 1 = stop watchdog.service before suspending and start it again on resume
# (the systemd system-sleep hook does this, so it also covers a plain
# `systemctl suspend`). Off by default: whether the Tegra hardware watchdog
# keeps counting across SC7 - and so resets the board mid-sleep - has not
# been tested on hardware yet. Turn this on if a suspended board reboots
# itself after ~a minute instead of staying asleep.
BOAT_SLEEP_STOP_WATCHDOG=0
