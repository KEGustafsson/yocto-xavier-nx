# Settings for boat-sleep-listener.service (/usr/bin/boat-sleepd).
# Systemd EnvironmentFile: plain KEY=value, no shell, no expansion.
#
# The listening PORT is NOT here - it belongs to boat-sleep-listener.socket,
# which is what actually binds it. Change it with:
#     systemctl edit boat-sleep-listener.socket
# and set ListenDatagram= to the new port. Then change the sender to match.

# Shared secret, hex, 32 bytes. Generate on the board and copy to the sender:
#     openssl rand -hex 32 > /etc/boat-sleep.key && chmod 0600 /etc/boat-sleep.key
# boat-sleepd refuses to start if this file is readable by group or others.
BOAT_SLEEP_KEY_FILE=/etc/boat-sleep.key

# Clock skew accepted between sender and board, in seconds. A packet outside
# this window is refused, which is what bounds how long a captured packet stays
# useful. Raise it only if the two clocks genuinely disagree - the fix for that
# is NTP, not a wider window.
BOAT_SLEEP_WINDOW=30

# Extra arguments passed to boat-sleep on a valid request. Empty means
# boat-sleep's own defaults, including its refusal to suspend when nothing can
# wake the board again. Setting --force here defeats the entire point of
# sending the packet, since you would then be unable to wake what you slept.
BOAT_SLEEP_ARGS=
