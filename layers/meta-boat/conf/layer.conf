# meta-boat layer configuration
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes/appends that only make sense when another layer is actually in
# bblayers.conf live under external/<that layer's collection name>/ and are
# added only if that collection is present. Same scheme meta-tegra uses (see
# its conf/layer.conf), and it is what keeps the LAYERRECOMMENDS below honest:
# a dangling .bbappend against a missing layer is a parse ERROR, so without
# this a minimal build without meta-openembedded would stop working.
BBFILES += "${@' '.join('${LAYERDIR}/external/%s/recipes*/*/*.bb' % layer \
               for layer in BBFILE_COLLECTIONS.split() if os.path.exists(os.path.join('${LAYERDIR}','external',layer)))}"
BBFILES += "${@' '.join('${LAYERDIR}/external/%s/recipes*/*/*.bbappend' % layer \
               for layer in BBFILE_COLLECTIONS.split() if os.path.exists(os.path.join('${LAYERDIR}','external',layer)))}"

BBFILE_COLLECTIONS += "boat"
BBFILE_PATTERN_boat = "^${LAYERDIR}/"
BBFILE_PRIORITY_boat = "10"

LAYERDEPENDS_boat = "core tegra"
LAYERSERIES_COMPAT_boat = "kirkstone"
# So another layer can express a versioned LAYERDEPENDS on this one; every
# layer this project fetches sets one.
LAYERVERSION_boat = "1"

# What boat-image actually needs, beyond the hard LAYERDEPENDS above. These are
# recommendations rather than dependencies so that a minimal build - just the
# meta-boat scripts and configs, no boat-image - still parses without them; but
# boat-image itself will not resolve unless all of them are in bblayers.conf:
#
#   openembedded-layer  chrony, and most of the -nettools/-tools set
#   networking-layer    blueman, modemmanager, the network diagnostics
#   meta-python         python3-* runtime deps
#   xfce-layer          packagegroup-xfce-base - the helm desktop
#   gnome-layer         network-manager-applet, and an xfce-layer LAYERDEPENDS
#   multimedia-layer    an xfce-layer LAYERDEPENDS
#   virtualization-layer docker-ce, python3-docker-compose - and the gate that
#                       makes meta-tegra enable its own nvidia-container-toolkit
#   tegra-community     python3-jetson-stats (jtop)
#
# scripts/02-configure-build.sh writes exactly this set into bblayers.conf;
# config/bblayers.conf.sample is the same list for a manual build.
LAYERRECOMMENDS_boat = "openembedded-layer networking-layer meta-python \
                        xfce-layer gnome-layer multimedia-layer \
                        virtualization-layer tegra-community"
