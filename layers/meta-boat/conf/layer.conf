# meta-boat layer configuration
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes/appends that only make sense when another layer is actually in
# bblayers.conf live under external/<that layer's collection name>/ and are
# added only if that collection is present. Same scheme meta-tegra uses (see
# its conf/layer.conf), and it is what keeps the LAYERRECOMMENDS below honest:
# a dangling .bbappend against a missing layer is a parse ERROR, so without
# this a minimal build without meta-openembedded would stop working.
BBFILES += "${@' '.join('${LAYERDIR}/external/%s/recipes*/*/*.bb' % layer \
               for layer in BBFILE_COLLECTIONS.split() if os.path.exists(os.path.join('${LAYERDIR}','external',layer)))}"
BBFILES += "${@' '.join('${LAYERDIR}/external/%s/recipes*/*/*.bbappend' % layer \
               for layer in BBFILE_COLLECTIONS.split() if os.path.exists(os.path.join('${LAYERDIR}','external',layer)))}"

BBFILE_COLLECTIONS += "boat"
BBFILE_PATTERN_boat = "^${LAYERDIR}/"
BBFILE_PRIORITY_boat = "10"

LAYERDEPENDS_boat = "core tegra"
LAYERSERIES_COMPAT_boat = "kirkstone"
# So another layer can express a versioned LAYERDEPENDS on this one; every
# layer this project fetches sets one.
LAYERVERSION_boat = "1"

# What boat-image actually needs, beyond the hard LAYERDEPENDS above. These are
# recommendations rather than dependencies so that a minimal build - just the
# meta-boat scripts and configs, no boat-image - still parses without them; but
# boat-image itself will not resolve unless all of them are in bblayers.conf:
#
#   openembedded-layer  chrony, and most of the -nettools/-tools set
#   networking-layer    blueman, modemmanager, the network diagnostics
#   meta-python         python3-* runtime deps
#   xfce-layer          packagegroup-xfce-base - the helm desktop
#   gnome-layer         network-manager-applet, and an xfce-layer LAYERDEPENDS
#   multimedia-layer    an xfce-layer LAYERDEPENDS
#   virtualization-layer docker-ce, python3-docker-compose - and the gate that
#                       makes meta-tegra enable its own nvidia-container-toolkit
#   tegra-community     python3-jetson-stats (jtop)
#   rauc                the A/B update client - needed only by an A/B build
#                       (BOAT_AB_LAYOUT below), and enforced there
#
# scripts/02-configure-build.sh writes exactly this set into bblayers.conf
# (meta-rauc only with AB_LAYOUT=1); config/bblayers.conf.sample is the same
# list for a manual build.
LAYERRECOMMENDS_boat = "openembedded-layer networking-layer meta-python \
                        xfce-layer gnome-layer multimedia-layer \
                        virtualization-layer tegra-community rauc"

# ---------------------------------------------------------------------------
# A/B OS updates (docs/plans/ab-os-updates.md). OFF unless the build is
# configured for it: scripts/02-configure-build.sh with AB_LAYOUT=1, or the
# kas/ab-updates.yml overlay, sets BOAT_AB_LAYOUT = "1" in local.conf along
# with the partition layout and boot settings that go with it. Every recipe
# change this layer makes for A/B is gated on this one variable, so a build
# without it is the single-slot image it always was.
BOAT_AB_LAYOUT ??= "0"

# The NVMe drive the slots live on, and the GPT entry number of every
# partition the boot and update path addresses. Numbers, not labels: a
# JetPack SD card or a USB stick can carry APP/esp labels too, and
# meta-tegra's flasher does not apply fixed PARTUUIDs. The devkit has one
# NVMe drive, always nvme0n1 (SD cards are mmcblk*, USB media sd*), and every
# consumer checks the GPT name at the number before acting on it.
# boat-ab-layout.py fails the build if NVIDIA's template ever stops putting
# these partitions at these numbers.
BOAT_AB_DISK ??= "/dev/nvme0n1"
BOAT_AB_PARTNUM_APP_A ??= "1"
BOAT_AB_PARTNUM_APP_B ??= "2"
BOAT_AB_PARTNUM_ESP ??= "12"
BOAT_AB_PARTNUM_SWAP ??= "17"
BOAT_AB_PARTNUM_DATA ??= "18"

# Sizes of the partitions the A/B layout adds after APP_b, in bytes. DATA is
# only a minimum: it fills the rest of the SSD at flash time.
BOAT_AB_SWAP_SIZE ??= "8589934592"
BOAT_AB_DATA_MIN_SIZE ??= "2147483648"

# The on-board half of the A/B boot path goes into EVERY image an A/B build
# makes, not only boat-image: the ESP's GRUB counts attempts whatever image
# is flashed, and without boat-ab-boot's commit step even a healthy slot is
# used up by its third boot. packagegroup-core-boot (in every image)
# pulls in MACHINE_ESSENTIAL_EXTRA_RDEPENDS.
# boat-storage likewise: swap, /data, and growing the flashed filesystems
# into their partitions matter to any image on this layout.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = "${@' boat-ab-boot boat-storage' if d.getVar('BOAT_AB_LAYOUT') == '1' else ''}"

# ...and the update client: RAUC with this layer's system.conf, keyring and
# root-only D-Bus policy (external/rauc), the install handlers, and the
# release string the image and its bundle share.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append = "${@' rauc boat-rauc-handlers boat-release' if d.getVar('BOAT_AB_LAYOUT') == '1' else ''}"

# The release string /etc/boat-release holds and an update bundle carries
# (scripts/env.sh). RAUC and the OTA check compare these as relaxed
# semantic versions. Empty means a development build, "0.0.0-dev": every
# such build reports the same version, so the OTA check never offers one
# over another - set a real BOAT_RELEASE for anything delivered over the
# air. (Not the build date: DATE is outside bitbake's parse-cache hash, and
# a task signature that depends on it breaks on the first build of a day.)
BOAT_RELEASE ??= ""
BOAT_RELEASE_EFFECTIVE = "${@d.getVar('BOAT_RELEASE') or '0.0.0-dev'}"

# Where the update signing keys are (scripts/gen-update-keys.sh). Set in
# local.conf by scripts/02-configure-build.sh, or passed in by kas.
BOAT_KEYS_DIR ??= ""

# RAUC's compatible string: a bundle for any other board is refused.
BOAT_BUNDLE_COMPATIBLE ??= "boat-xavier-nx"

# RAUC's min-bundle-version (plan D6): empty accepts any version. Raise it
# deliberately in the release that must never be downgraded below.
BOAT_MIN_BUNDLE_VERSION ??= ""

# DATA's first filesystem, written by the flash: meta-tegra copies
# IMAGE_TEGRAFLASH_DATA into the tegraflash package as DATAFILE, and the
# generated layout names DATAFILE as DATA's contents. The board itself never
# formats DATA - see recipes-boat/storage/boat-data-seed.bb.
IMAGE_TEGRAFLASH_DATA = "${@'${DEPLOY_DIR_IMAGE}/boat-data-seed.ext4' if d.getVar('BOAT_AB_LAYOUT') == '1' else ''}"
DATAFILE = "${@'boat-data-seed.ext4' if d.getVar('BOAT_AB_LAYOUT') == '1' else ''}"
do_image_tegraflash[depends] += "${@'boat-data-seed:do_deploy' if d.getVar('BOAT_AB_LAYOUT') == '1' else ''}"
