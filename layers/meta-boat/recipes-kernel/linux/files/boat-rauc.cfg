# A/B OS updates (docs/plans/ab-os-updates.md 5.7, 5.10), added only to an
# A/B build. RAUC mounts a bundle as a loop-backed squashfs under dm-verity,
# and a streamed bundle through NBD.
#
# NBD is built in, not a module: RAUC's streaming client opens /dev/nbd*
# directly, and nothing would load the module for it. Built in, enabling
# streaming later needs no new kernel. The rest is what tegra_defconfig
# already sets, stated here so a BSP update cannot drop it unnoticed.
CONFIG_BLK_DEV_NBD=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
