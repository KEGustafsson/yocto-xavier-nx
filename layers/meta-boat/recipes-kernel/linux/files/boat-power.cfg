# Suspend-to-RAM (Tegra SC7) for remote sleep/wake, merged into meta-tegra's
# linux-tegra_5.10 defconfig via the standard kernel-yocto .cfg mechanism -
# same as boat-docker.cfg next to it. See docs/05-phase2-boat-computer-layer.md
# "Power: Wake-on-LAN and remote SC7".
#
# Deliberately PM-only. The Ethernet side of Wake-on-LAN needs no fragment:
# whichever driver this board's RJ45 lands on (the Tegra MAC's nvethernet, or
# r8169 for a Realtek PCIe part) is already in the BSP defconfig, and both
# carry their magic-packet support with them. Whether the PHY stays powered
# across SC7 is a board/DT property, not a Kconfig one - `boat-wol-arm`
# reports at runtime what the driver actually offers.

# Core power management + suspend-to-RAM. CONFIG_SUSPEND is what puts "mem"
# in /sys/power/state; without it boat-sleep has nothing to write to.
CONFIG_PM=y
CONFIG_PM_SLEEP=y
CONFIG_SUSPEND=y
CONFIG_SUSPEND_FREEZER=y

# Diagnostics for a board that won't sleep or won't come back: adds
# /sys/power/pm_debug_messages and per-device suspend/resume timing in the
# journal. Cheap, and the alternative when a marine install won't resume is
# a serial console at the helm.
CONFIG_PM_DEBUG=y
CONFIG_PM_SLEEP_DEBUG=y
