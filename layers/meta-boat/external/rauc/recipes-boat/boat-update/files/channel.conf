# boat-update's defaults, shipped by the image (docs/07-updates.md). Do not
# edit this file on the board - an update replaces it. Put your own settings
# in /data/boat-update/channel.conf instead: that file is shared by both
# slots, so it stays right after an update and after a rollback.

# The update channel: an https:// URL with Range support, naming the final
# location (no redirects are followed), and no user name or password in it.
# Empty = no over-the-air updates. A fleet image can carry it: BOAT_UPDATE_URL
# (and BOAT_UPDATE_CHANNEL) in the build's local.conf.
BOAT_UPDATE_URL="@BOAT_UPDATE_URL@"

# Which channel to follow: stable (the boats), testing (a test board
# running a boat image, which gets each release first) or bench (a
# BOAT_BENCH image on the validation bench).
BOAT_UPDATE_CHANNEL=@BOAT_UPDATE_CHANNEL@

# What the timer does on its own: off, check (only report), or download
# (check, and fetch in the background). It never installs or reboots.
BOAT_UPDATE_AUTO=download

# Download over a metered link (cellular, a 4G router marked metered)? A
# USB modem or a tethered phone counts as metered unless its connection is
# marked 'metered no'.
BOAT_UPDATE_METERED=no

# curl --limit-rate for downloads, e.g. 200k. Empty = no limit.
BOAT_UPDATE_RATE_LIMIT=""

# A TLS client certificate and key, if the channel requires one. Empty =
# use /data/boat-update/client.crt and client.key when they exist. The key -
# or the certificate file, when it holds the key too - must be root's alone.
BOAT_UPDATE_CLIENT_CERT=""
BOAT_UPDATE_CLIENT_KEY=""

# The CA that signed the channel's TLS certificate, when the image's
# ca-certificates does not trust it - a bench server with its own CA, such
# as Caddy's "tls internal" (give its root, pki/authorities/local/root.crt:
# the intermediate changes every week). Empty = use /data/boat-update/server-ca.pem
# when it exists, else only the image's trust store. On /data it stays
# after an update; a CA added to the slot's /etc/ssl would not.
BOAT_UPDATE_SERVER_CA=""
