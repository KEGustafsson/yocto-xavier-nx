# meta-boat: RAUC keeps its status and the adaptive-update index in
# /data/rauc, on the shared DATA partition. Without /data mounted it would
# create that directory on the slot's own rootfs, and the board would lose
# the record when it switches slots - so RAUC does not start without it.
#
# Its grub backend runs grub-editenv by name, which would rewrite grubenv in
# place: /usr/lib/boat-ab/bin (boat-ab-boot) comes first on its PATH, and
# the grub-editenv there makes every RAUC write to grubenv atomic and takes
# the A/B lock (docs/plans/ab-os-updates.md 5.3).
[Unit]
RequiresMountsFor=/data

[Service]
Environment=PATH=/usr/lib/boat-ab/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
