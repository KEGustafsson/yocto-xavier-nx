<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  meta-boat replaces RAUC's own policy, which lets ANY local user - and any
  container given the system bus - call Install (even with
  ignore-compatible) and Mark. Only root may talk to RAUC here; everyone
  else is refused. See docs/plans/ab-os-updates.md section 5.7.

  dbus-daemon goes by uid: a container that runs as root (uid 0 - Docker's
  default, without user-namespace remapping) and has the system bus mounted
  IS root here. Run such containers as an unprivileged user.
-->
<busconfig>
  <policy user="root">
    <allow own="de.pengutronix.rauc"/>
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>

  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>
</busconfig>
