# Optional: reproducible build via kas (https://kas.readthedocs.io).
#
#   pip3 install kas
#   kas build kas/xavier-nx-nvme.yml           # build boat-image
#   kas shell kas/xavier-nx-nvme.yml           # drop into a configured bitbake shell
#
# This mirrors what scripts/01..03 do, but pins layers and centralises config.
# Replace the branch refs with commit hashes for a fully reproducible product.
header:
  version: 14

machine: jetson-xavier-nx-devkit
distro: poky
target: boat-image

repos:
  meta-boat:
    # this repository (the layer lives under layers/meta-boat)
    layers:
      layers/meta-boat:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: kirkstone
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: kirkstone
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      # meta-xfce is the Phase-2 helm desktop; meta-multimedia and meta-gnome
      # are its declared LAYERDEPENDS, not something this project uses
      # directly.
      meta-multimedia:
      meta-gnome:
      meta-xfce:

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra.git
    branch: kirkstone

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: kirkstone

  meta-tegra-community:
    url: https://github.com/OE4T/meta-tegra-community.git
    branch: kirkstone

local_conf_header:
  nvme-boot: |
    LICENSE_FLAGS_ACCEPTED += "commercial"
    INIT_MANAGER = "systemd"
    # boat-image needs these; see the long explanation in
    # scripts/02-configure-build.sh. "virtualization" gates Docker and
    # nvidia-container-toolkit, "x11"/"opengl" the Xorg + XFCE helm desktop,
    # "pam" the logind session that unprivileged Xorg needs, and "polkit" is
    # what lets the desktop user reboot/shut down/suspend at all (without it
    # XFCE's Log Out dialog has those three greyed out).
    DISTRO_FEATURES:append = " virtualization opengl pam x11 polkit"
    # Same rm_work / shared-dir choices the scripts make, so a kas build does
    # not need 50GB+ of work directories or re-download on every re-init.
    INHERIT += "rm_work"
    # ---- Newer-host accommodations (see docs/02 "Newer hosts") ----
    # kirkstone's tested-distro list stops at ubuntu-24.04; sanity.bbclass splits
    # this on the literal two-character sequence \n. Append your release rather
    # than blanking the variable, so a genuinely untested host still warns.
    SANITY_TESTED_DISTROS:append = " \n ubuntu-26.04 \n"
    # kirkstone pins uninative 4.7 (glibc 2.41). When the host glibc is newer,
    # bitbake disables uninative (and warns) rather than risk corrupting sstate;
    # 5.2 ships glibc 2.44. Bumping relocates native/cross sstate
    # (NATIVELSBSTRING becomes "universal-<gccver>"), so expect one cross-toolchain
    # rebuild after changing it.
    # ":forcevariable" is required: local.conf is parsed before the distro
    # config that sets these with a plain "=", so a plain assignment loses.
    UNINATIVE_VERSION:forcevariable = "5.2"
    UNINATIVE_MAXGLIBCVERSION:forcevariable = "2.44"
    UNINATIVE_CHECKSUM[x86_64] = "1a2749c1379fd9f60ea3c82f1bf4844924d5a99117b74a70c57036e94e2379d4"
    UNINATIVE_CHECKSUM[aarch64] = "8cf46c7ba75ebb1863fd6b74cf7d7ab910a3e99de4f01b1e9490babf8e6b9e05"
    # ---- Newer hosts: uncomment these four ----
    # kirkstone predates current host toolchains: newer GCC defaults (C23)
    # break old gnulib/K&R code in several -native recipes, so those builds
    # want gcc-12/g++-12 (`sudo apt-get install gcc-12 g++-12`). Absolute paths
    # because bitbake tasks run with a sanitized PATH.
    #
    # COMMENTED OUT ON PURPOSE, and this is the one thing kas cannot do that
    # scripts/02-configure-build.sh can: that script emits these lines only
    # when /usr/bin/gcc-12 actually exists. A static config has no such test,
    # so setting them unconditionally would break every host WITHOUT gcc-12 -
    # including Ubuntu 20.04, which this project supports and whose archive has
    # no gcc-12 at all - with "/usr/bin/gcc-12: No such file or directory"
    # twenty minutes into a build. Uncomment them if your host GCC is newer
    # than 12 and you have installed gcc-12; leave them alone otherwise.
    # BUILD_CC = "${CCACHE}/usr/bin/gcc-12 ${BUILD_CC_ARCH}"
    # BUILD_CXX = "${CCACHE}/usr/bin/g++-12 ${BUILD_CC_ARCH}"
    # BUILD_CPP = "/usr/bin/gcc-12 ${BUILD_CC_ARCH} -E"
    # BUILD_CCLD = "/usr/bin/gcc-12 ${BUILD_CC_ARCH}"
    # Boot the rootfs from the first NVMe SSD:
    TNSPEC_BOOTDEV = "nvme0n1p1"
    ROOTFSPART_SIZE = "17179869184"
    # Total external-device capacity in 512-byte sectors - ROOTFSPART_SIZE plus
    # 1 GiB of headroom for the kernel/recovery/esp/UDA partitions that share
    # the drive. Without it (and without the QSPI-only internal template below)
    # tegraparser_v2 rejects the layout and initrd-flash fails with
    # "End sector for APP, expected at: <N>, actual: 0" - after the whole build
    # has completed. Both are mandatory for this MACHINE, not tuning; see the
    # long comment in scripts/02-configure-build.sh.
    #
    # DERIVED from ROOTFSPART_SIZE rather than hardcoded, so raising the rootfs
    # size cannot silently leave APP larger than the capacity declared here -
    # which fails at flash time, long after the change that caused it.
    TEGRA_EXTERNAL_DEVICE_SECTORS = "${@(int(d.getVar('ROOTFSPART_SIZE')) + 1073741824) // 512}"
    PARTITION_LAYOUT_TEMPLATE_DEFAULT = "flash_l4t_t194_qspi_p3668.xml"
