# Tier 0 CI: repository checks. No Yocto layers are fetched and bitbake is
# never run, so this takes several minutes, not hours. The time goes on the
# harnesses that run the shipped scripts (scripts/test-*.py); boat-update's,
# against a local HTTPS channel, alone takes about 30 s on each of the two
# Pythons it runs under.
#
# SCOPE, deliberately: this cannot catch recipe parse errors, unresolvable
# RDEPENDS, or packaging QA failures (e.g. "An allarch packagegroup shouldn't
# depend on packages which are dynamically renamed") - the last of those needs
# a real image build, because `bitbake -n` passes clean on it. Green here means
# "nothing obviously broken", not "this builds".
#
# The job only installs tools and calls scripts/lint.sh, which is the same
# thing you run locally - so CI and your machine can't drift apart.
name: lint

on:
  # Branch-filtered on push so a pull request from a branch in this repo runs
  # the job once, not twice (push + pull_request both fire otherwise).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same ref; nothing here is
# worth finishing for a commit that has already been replaced.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier0:
    name: Shell, YAML, docs and recipe references
    runs-on: ubuntu-latest
    # The whole job is several minutes of work; anything far past that is a
    # hung apt mirror, a hung harness or a runner problem, and a 6-hour
    # default timeout just holds a slot while saying nothing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install check tools
        run: |
          sudo apt-get update -qq
          # grub-emu and the disk-image tools run the A/B GRUB state machine
          # (scripts/test-grub-ab.py) in GRUB itself.
          sudo apt-get install -y --no-install-recommends shellcheck python3-yaml \
            grub-emu gdisk dosfstools mtools

      # The boat runs Python 3.10 (kirkstone); the runner's python3 is newer.
      # A separate 3.10 - not put first on PATH - for lint.sh's check of
      # the Python that ships to the boat.
      - name: The boat's Python (3.10)
        id: py310
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          update-environment: false

      # LINT_STRICT=1 turns "tool not installed" into a failure. Without it a
      # missing tool is only a warning, which is right for a developer laptop
      # and wrong for CI - a silently skipped check reads exactly like a
      # passing one.
      - name: Run checks
        env:
          BOAT_TARGET_PYTHON: ${{ steps.py310.outputs.python-path }}
        run: LINT_STRICT=1 ./scripts/lint.sh
